<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>문의하기</title>
  <meta name="description" content="문의하기 양식입니다">
  <meta name="og:title" content="문의하기 양식">
  <meta name="og:description" content="문의하기 양식입니다">
  <meta name="og:url" content="https://jejunu.ac.kr">
</head>
<body>

<header>
  <h1>문의하기</h1>
</header>
<main>
  <img src="https://github.com/Baw-Appie.png" alt="프로필 사진" width="50" height="50">
  <form>
    <fieldset>
      <legend>문의하기 양식</legend>
      <label for="name">이름</label>
      <input type="text" id="name">
      <label for="email">이메일</label>
      <input type="email" id="email"><br />
      <label for="type">문의 유형</label>
      <select id="type">
        <option value="a">단순 문의</option>
        <option value="b">제품 문의</option>
        <option value="c">기타 문의</option>
      </select><br />
      <label for="message">문의 내용</label>
      <textarea id="message"></textarea><br />
      <button type="submit">제출</button>
    </fieldset>
  </form>
</main>
<footer>
  <p>Copyright (c) 2023 JEJU NATIONAL UNIVERSITY. ALL RIGHTS RESERVED.</p>
</footer>

</body>
</html>
